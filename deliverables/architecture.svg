<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Confidence-aware persistent 3D scene memory architecture</title>
  <desc id="desc">Observations flow through geometry, persistent memory, a token adapter, and a frozen VLA to an action.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
    <style>.box{stroke:#334155;stroke-width:2;rx:16}.t{font:600 19px Arial,sans-serif;fill:#0f172a}.s{font:15px Arial,sans-serif;fill:#334155}.a{stroke:#334155;stroke-width:3;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="330" fill="#f8fafc"/>
  <rect class="box" x="35" y="100" width="180" height="120" fill="#dbeafe"/><text class="t" x="125" y="140" text-anchor="middle">RGB-D / video</text><text class="s" x="125" y="170" text-anchor="middle">current observation</text><text class="s" x="125" y="194" text-anchor="middle">+ instruction</text>
  <line class="a" x1="215" y1="160" x2="265" y2="160"/>
  <rect class="box" x="275" y="75" width="205" height="170" fill="#dcfce7"/><text class="t" x="377" y="116" text-anchor="middle">Geometry frontend</text><text class="s" x="377" y="150" text-anchor="middle">pose · depth · tracks</text><text class="s" x="377" y="177" text-anchor="middle">world coordinates</text><text class="s" x="377" y="204" text-anchor="middle">diagnostic confidence</text>
  <line class="a" x1="480" y1="160" x2="530" y2="160"/>
  <rect class="box" x="540" y="52" width="235" height="216" fill="#fef3c7"/><text class="t" x="657" y="93" text-anchor="middle">Persistent memory</text><text class="s" x="657" y="127" text-anchor="middle">stable ID · xyz · feature</text><text class="s" x="657" y="154" text-anchor="middle">confidence · last seen</text><text class="s" x="657" y="190" text-anchor="middle">fuse consistent</text><text class="s" x="657" y="217" text-anchor="middle">decay unseen · replace stale</text>
  <line class="a" x1="775" y1="160" x2="825" y2="160"/>
  <rect class="box" x="835" y="88" width="175" height="144" fill="#ede9fe"/><text class="t" x="922" y="128" text-anchor="middle">Token adapter</text><text class="s" x="922" y="160" text-anchor="middle">pad · mask · scale</text><text class="s" x="922" y="187" text-anchor="middle">or prompt injection</text>
  <line class="a" x1="1010" y1="160" x2="1060" y2="160"/>
  <rect class="box" x="1070" y="100" width="100" height="120" fill="#fee2e2"/><text class="t" x="1120" y="146" text-anchor="middle">VLA</text><text class="s" x="1120" y="176" text-anchor="middle">action</text>
  <path d="M 657 268 C 657 305, 377 305, 377 245" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text class="s" x="517" y="319" text-anchor="middle">world-aligned updates over time</text>
</svg>
